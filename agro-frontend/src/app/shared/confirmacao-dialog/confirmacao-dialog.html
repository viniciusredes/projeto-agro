<h2 mat-dialog-title>{{ dados.titulo }}</h2>

<mat-dialog-content>
  <p class="mensagem">{{ dados.mensagem }}</p>

  @if (dados.detalhes?.length) {
    <ul class="detalhes">
      @for (item of dados.detalhes; track $index) {
        <li>{{ item }}</li>
      }
    </ul>
  }

  @if (dados.irreversivel) {
    <p class="irreversivel">
      <mat-icon>warning</mat-icon>
      Esta ação não pode ser desfeita.
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <!-- mat-dialog-close fecha o diálogo e devolve o valor para quem abriu (afterClosed) -->
  <button mat-button type="button" [mat-dialog-close]="false">{{ dados.cancelar ?? 'Cancelar' }}</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true" cdkFocusInitial>{{ dados.confirmar }}</button>
</mat-dialog-actions>
