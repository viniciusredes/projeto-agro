<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Agro Frota</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0f633e" />
    <!-- Aplica o tema salvo ANTES do Angular carregar (evita a tela "piscar" em claro).
         O TemaService grava a escolha em localStorage com a chave "agro-frota-tema". -->
    <script>
      try {
        var tema = localStorage.getItem('agro-frota-tema');
        if (tema === 'claro' || tema === 'escuro') {
          document.documentElement.classList.add('tema-' + tema);
        }
      } catch (e) {
        /* sem acesso ao localStorage: segue o tema do sistema */
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
